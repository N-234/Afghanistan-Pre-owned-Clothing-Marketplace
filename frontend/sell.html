<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Your Clothes | Afghan Girls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="index.html">Afghan Girls</a>
        <a href="index.html">Back to Home</a>
    </nav>

    <main class="account-page">
        <h1>Sell Your Clothes</h1>
        <p>Add your clothing details and a clear photo.</p>

        <form id="sell-form">
            <label for="item-name">Clothing name</label>
            <input id="item-name" name="title"
                   type="text" maxlength="100" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="dress">Dress</option>
                <option value="shirt">Shirt</option>
                <option value="trousers">Trousers</option>
                <option value="jacket">Jacket</option>
                <option value="traditional">Traditional Clothes</option>
            </select>

            <label for="price">Price (AFN)</label>
            <input id="price" name="price"
                   type="number" min="1" step="1" required>

            <label for="size">Size</label>
            <select id="size" name="size" required>
                <option value="">Select size</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>Other</option>
            </select>

            <label for="condition">Condition</label>
            <select id="condition" name="condition" required>
                <option value="">Select condition</option>
                <option>New</option>
                <option>Like New</option>
                <option>Good</option>
                <option>Used</option>
            </select>

            <label for="city">City</label>
            <input id="city" name="city"
                   type="text" maxlength="100" required>

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      rows="4" maxlength="2000" required></textarea>

            <label for="photo">Clothing photo</label>
            <input id="photo" name="photo" type="file"
                   accept="image/jpeg,image/png,image/webp"
                   aria-describedby="photo-help" required>

            <small id="photo-help">
                JPG, PNG or WebP, up to 5 MB.
            </small>

            <img id="photo-preview"
                 alt="Your selected clothing photo" hidden>

            <button class="account-button" type="submit" disabled>
                Preview Listing
            </button>

            <p id="sell-message" role="status"></p>
        </form>
        <section id="listing-preview" hidden
         aria-labelledby="preview-heading">
    <h2 id="preview-heading">Your Listing Preview</h2>

    <article class="product-card">
        <img id="listing-photo" class="product-image"
             alt="Selected clothing photo">

        <div class="product-info">
            <h3 id="listing-title"></h3>
            <p id="listing-category"></p>
            <p id="listing-size"></p>
            <p id="listing-condition"></p>
            <p id="listing-city"></p>
            <p id="listing-price" class="price"></p>
            <p id="listing-description"></p>
        </div>
    </article>

    <p>This is a preview. Your listing is not published.</p>
</section>

        <p class="demo-note">
            Preview only. Publishing will require a logged-in account.
        </p>
    </main>
<script src="sell.js"></script>
</body>
</html>
