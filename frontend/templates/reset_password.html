<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Afghan Girls</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="/">Afghan Girls</a>
        <a href="/login">Back to Login</a>
    </nav>

    <main class="account-page">
        <h1>Reset Your Password</h1>
        <p>Choose a new password for your account.</p>

        <form id="reset-password-form"
              action="/reset-password"
              method="post">

            <input type="hidden" id="reset-token" name="token">

            <label for="new-password">New password</label>
            <input
                id="new-password"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="password-help"
                required
            >
            <small id="password-help">
                Use at least 8 characters.
            </small>

            <label for="confirm-password">Confirm password</label>
            <input
                id="confirm-password"
                name="confirm_password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button class="account-button" type="submit">
                Reset Password
            </button>

            <p id="reset-password-message" role="status"></p>
        </form>
    </main>

    <script src="../static/js/reset_password.js"></script>
</body>
</html>
