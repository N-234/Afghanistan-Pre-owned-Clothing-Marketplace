<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Afghan Girls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="index.html">Afghan Girls</a>
        <a href="index.html">Back to Home</a>
    </nav>

    <main class="account-page">
        <h1>Welcome Back</h1>
        <p>Log in to manage your clothing listings.</p>

        <form id="login-form">
            <label for="email">Email address</label>
            <input id="email" name="email"
                   type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password"
                   autocomplete="current-password" required>

            <button class="account-button" type="submit">
                Log In
            </button>

            <p id="login-message" role="status"></p>
        </form>

        <p>Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p class="demo-note">
            Form preview: login is not connected yet.
            Use sample information when testing.
        </p>
    </main>

    <script src="login.js"></script>
</body>
</html>
