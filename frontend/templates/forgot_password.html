<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Afghan Girls</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="/">Afghan Girls</a>
        <a href="/login">Back to Login</a>
    </nav>

    <main class="account-page">
        <h1>Forgot Password?</h1>
        <p>Enter your email address to request a password reset link.</p>

        <form id="forgot-password-form"
              action="/forgot-password"
              method="post">
            <label for="reset-email">Email address</label>
            <input
                id="reset-email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <button class="account-button" type="submit">
                Send Reset Link
            </button>

            <p id="forgot-password-message" role="status"></p>
        </form>
    </main>

    <script src="../static/js/forgot_password.js"></script>
</body>
</html>
