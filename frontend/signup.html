<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Afghan Girls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="index.html">Afghan Girls</a>
        <a href="index.html">Back to Home</a>
    </nav>

    <main class="account-page">
        <h1>Create Your Account</h1>
        <p>Join our community to buy and sell pre-owned clothes.</p>

        <form id="signup-form">
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name"
                   type="text" autocomplete="name"
                   maxlength="100" required>

            <label for="email">Email address</label>
            <input id="email" name="email"
                   type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" autocomplete="new-password"
                   minlength="8" aria-describedby="password-help"
                   required>
            <small id="password-help">Use at least 8 characters.</small>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password"
                   type="password" autocomplete="new-password"
                   minlength="8" required>

            <button class="account-button" type="submit">
                Create Account
            </button>

            <p id="signup-message" role="status"></p>
        </form>

        <p class="demo-note">
            Form preview: account registration is not connected yet.
            Use sample information when testing.
        </p>
    </main>

    <script src="signup.js"></script>
</body>
</html>
